blueprint:
  name: EV Load Balancer
  description: Automatically adjust the charge power of the EV based on the current load.
  domain: automation
  input:
    zaptec_installation:
      name: Zaptec Installation
      description: The Zaptec installation to control.
      selector:
        device:
          filter:
            - integration: zaptec

    charger_mode_entity:
      name: Charger mode
      description: The mode of the charger.
      selector:
        entity:
          filter:
            - domain: sensor
              integration: zaptec

    charger_min_current_entity:
      name: Charger min current
      description: The minimum current to deliver to the EV per phase.
      selector:
        entity:
          filter:
            - domain: number
              integration: zaptec

    charger_max_current_entity:
      name: Charger max current
      description: The maximum current the charger can handle.
      selector:
        entity:
          filter:
            - domain: number
              integration: zaptec

    installation_max_power:
      name: Max installation power
      description: The maximum power the installation can handle in amperes.
      default: 20
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "A"

    installation_current_power_l1_entity:
      name: Installation current power L1
      description: The current draw of the whole installation on L1, in amps.
      selector:
        entity:
          filter:
            - domain: sensor
              integration: tibber

    installation_current_power_l2_entity:
      name: Installation current power L2
      description: The current power of the installation in Amps.
      selector:
        entity:
          filter:
            - domain: sensor
              integration: tibber

    installation_current_power_l3_entity:
      name: Installation current power L3
      description: The current power of the installation in Amps.
      selector:
        entity:
          filter:
            - domain: sensor
              integration: tibber

    charger_current_power_l1_entity:
      name: Charger current power L1
      description: The current power of the charger in Amps.
      selector:
        entity:
          filter:
            - domain: sensor
              integration: zaptec

    charger_current_power_l2_entity:
      name: Charger current power L2
      description: The current power of the charger in Amps.
      selector:
        entity:
          filter:
            - domain: sensor
              integration: zaptec

    charger_current_power_l3_entity:
      name: Charger current power L3
      description: The current power of the charger in Amps.
      selector:
        entity:
          filter:
            - domain: sensor
              integration: zaptec

    min_power_adjustment:
      name: Minimum Power Adjustment
      description: >-
        Deadband in amperes. An *increase* to the charge current is only written when it is
        at least this large, which stops a slowly drifting house load from rewriting the
        limit every quarter hour. Reductions are always written immediately.
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: "A"

    safety_margin:
      name: Safety margin
      description: >-
        Amperes held back from the installation limit on every phase. The charger is
        allowed up to (max installation power - this margin - other household load).
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 1
          unit_of_measurement: "A"

    installation_available_current_l1_entity:
      name: Installation available current L1 (optional)
      description: >-
        The limit currently set on the installation for L1 - for Zaptec this is the
        "Available current phase 1" sensor. Supplying all three lets the deadband compare
        against what was actually commanded. Leave empty to fall back to the measured
        charger draw, which is less precise but needs no extra entities.
      default: {}
      selector:
        entity:
          filter:
            - domain: sensor
              integration: zaptec

    installation_available_current_l2_entity:
      name: Installation available current L2 (optional)
      description: As above, for L2.
      default: {}
      selector:
        entity:
          filter:
            - domain: sensor
              integration: zaptec

    installation_available_current_l3_entity:
      name: Installation available current L3 (optional)
      description: As above, for L3.
      default: {}
      selector:
        entity:
          filter:
            - domain: sensor
              integration: zaptec

variables:
  input_zaptec_installation: !input zaptec_installation
  input_installation_max_power: !input installation_max_power
  input_charger_min_current_entity: !input charger_min_current_entity
  input_charger_max_current_entity: !input charger_max_current_entity
  input_installation_current_power_l1_entity: !input installation_current_power_l1_entity
  input_installation_current_power_l2_entity: !input installation_current_power_l2_entity
  input_installation_current_power_l3_entity: !input installation_current_power_l3_entity
  input_charger_current_power_l1_entity: !input charger_current_power_l1_entity
  input_charger_current_power_l2_entity: !input charger_current_power_l2_entity
  input_charger_current_power_l3_entity: !input charger_current_power_l3_entity
  input_charger_mode_entity: !input charger_mode_entity
  input_min_power_adjustment: !input min_power_adjustment
  input_safety_margin: !input safety_margin
  input_installation_available_current_l1_entity: !input installation_available_current_l1_entity
  input_installation_available_current_l2_entity: !input installation_available_current_l2_entity
  input_installation_available_current_l3_entity: !input installation_available_current_l3_entity

mode: restart
trace:
  stored_traces: 50

trigger:
  - platform: time_pattern
    # Runs every 15 minutes
    minutes: /15
  - platform: numeric_state
    entity_id:
      - !input installation_current_power_l1_entity
      - !input installation_current_power_l2_entity
      - !input installation_current_power_l3_entity
    above: !input installation_max_power
    for:
      seconds: 10

condition:
  # First check if charger is in Charging mode before proceeding with any other checks
  - condition: template
    value_template: >
      {{ states(input_charger_mode_entity) == 'connected_charging' }}

  # Never act on a fabricated reading. If any measurement is missing we cannot know the
  # real load, so leave the limit exactly where it is rather than computing headroom from
  # a substituted zero - which would read as "no load" and raise the current to maximum.
  - condition: template
    value_template: >
      {{ has_value(input_installation_current_power_l1_entity)
         and has_value(input_installation_current_power_l2_entity)
         and has_value(input_installation_current_power_l3_entity)
         and has_value(input_charger_current_power_l1_entity)
         and has_value(input_charger_current_power_l2_entity)
         and has_value(input_charger_current_power_l3_entity)
         and has_value(input_charger_min_current_entity)
         and has_value(input_charger_max_current_entity) }}

action:
  - variables:
      # Get the input values. The condition block has already established that every
      # measurement entity has a value, so the defaults below are belt-and-braces only.
      # They are deliberately pessimistic: an unreadable house load is assumed to be the
      # full installation limit, and an unreadable charger draw is assumed to be zero, so
      # any surprise pushes the result down rather than up.
      installation_max_power: "{{ input_installation_max_power | float(0) }}"
      safety_margin: "{{ input_safety_margin | float(1) }}"
      deadband: "{{ input_min_power_adjustment | float(0) }}"
      charger_min_current: "{{ states(input_charger_min_current_entity) | float(0) }}"
      charger_max_current: "{{ states(input_charger_max_current_entity) | float(0) }}"
      installation_current_power_l1: "{{ states(input_installation_current_power_l1_entity) | float(input_installation_max_power) }}"
      installation_current_power_l2: "{{ states(input_installation_current_power_l2_entity) | float(input_installation_max_power) }}"
      installation_current_power_l3: "{{ states(input_installation_current_power_l3_entity) | float(input_installation_max_power) }}"
      charger_current_power_l1: "{{ states(input_charger_current_power_l1_entity) | float(0) }}"
      charger_current_power_l2: "{{ states(input_charger_current_power_l2_entity) | float(0) }}"
      charger_current_power_l3: "{{ states(input_charger_current_power_l3_entity) | float(0) }}"

  - variables:
      # Headroom per phase, at full precision. The measurement is deliberately NOT rounded:
      # truncating it to a whole amp invented up to 1 A of headroom that did not exist, and
      # the error was worst exactly when the house sat closest to the limit. At a measured
      # 19.9 A of a 20 A fuse, truncation reported 1 A spare and the balancer stopped
      # backing off entirely.
      available_charge_amps_l1: "{{ installation_max_power - safety_margin - installation_current_power_l1 }}"
      available_charge_amps_l2: "{{ installation_max_power - safety_margin - installation_current_power_l2 }}"
      available_charge_amps_l3: "{{ installation_max_power - safety_margin - installation_current_power_l3 }}"

  - variables:
      # What the charger should be allowed on each phase, clamped to its own limits.
      # Flooring the result (| int on a value that is always >= charger_min_current) keeps
      # the rounding on the safe side. The old code subtracted a hardcoded 1 A here, which
      # was not a deadband but a permanent offset - it meant a 16 A charger could never be
      # given more than 15 A even with the whole installation idle. The margin now lives in
      # the headroom calculation above, where it belongs.
      target_current_l1: "{{ ([[charger_current_power_l1 + available_charge_amps_l1, charger_max_current] | min, charger_min_current] | max) | int }}"
      target_current_l2: "{{ ([[charger_current_power_l2 + available_charge_amps_l2, charger_max_current] | min, charger_min_current] | max) | int }}"
      target_current_l3: "{{ ([[charger_current_power_l3 + available_charge_amps_l3, charger_max_current] | min, charger_min_current] | max) | int }}"

  - variables:
      # The limit currently set on the installation. When the optional sensors are supplied
      # this is exact; otherwise fall back to the measured charger draw, which is what this
      # blueprint compared against before and keeps existing configurations working.
      commanded_l1: >-
        {{ (states(input_installation_available_current_l1_entity) | float(charger_current_power_l1))
           if input_installation_available_current_l1_entity else charger_current_power_l1 }}
      commanded_l2: >-
        {{ (states(input_installation_available_current_l2_entity) | float(charger_current_power_l2))
           if input_installation_available_current_l2_entity else charger_current_power_l2 }}
      commanded_l3: >-
        {{ (states(input_installation_available_current_l3_entity) | float(charger_current_power_l3))
           if input_installation_available_current_l3_entity else charger_current_power_l3 }}

  - variables:
      # Reductions are written immediately - that is the entire purpose of the automation.
      # Increases must clear the deadband first. This is what min_power_adjustment was
      # always documented to do; previously it was read into a variable and never used.
      needs_update: >-
        {{ target_current_l1 < commanded_l1
           or target_current_l2 < commanded_l2
           or target_current_l3 < commanded_l3
           or target_current_l1 - commanded_l1 >= deadband
           or target_current_l2 - commanded_l2 >= deadband
           or target_current_l3 - commanded_l3 >= deadband }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ needs_update }}"
        sequence:
          - action: zaptec.limit_current
            data:
              device_id: !input zaptec_installation
              available_current_phase1: "{{ target_current_l1 }}"
              available_current_phase2: "{{ target_current_l2 }}"
              available_current_phase3: "{{ target_current_l3 }}"
